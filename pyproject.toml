[project]
name = "digital-rivers"
version = "0.4.0"
description = "DEM and raster data processing library"
readme = {file = "README.md", content-type = "text/markdown"}
authors = [
    { name = "Mostafa Farrag", email = "moah.farag@gmail.com" }
]
license = {text = "GNU General Public License v3"}
keywords = ["GIS", "DEM", "Hydrology"]

classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: GIS",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
]

requires-python = ">= 3.11, <4"

# pyramids-gis is floored at a released PyPI version. The hard requirement is
# >=0.59.0, the release that renamed `create_from_array` (flat `geo` / `epsg` /
# `top_left_corner` / `cell_size` keywords) to
# `Dataset.from_array(geo_ref=GeoReference(...))` with no compatibility alias —
# every raster this package builds goes through that call. The other APIs it
# uses landed earlier: `plot(color=ColorScaling...)` in 0.51.0, the x-first
# `Window` and the grouped `to_cog(compression=...)` options before that.
# 0.60.0 rather than 0.59.0 is the floor simply because that is the release the
# port was written and verified against, and the one pinned in pixi.lock.
# The floor must also stay >=0.29.0, the first pyramids-gis whose bundled GDAL
# exposes gdal.ViewshedGenerate + the GVM_* viewshed enums used by
# Terrain.viewshed.
dependencies = [
    "pyramids-gis >=0.60.0",
    "geopandas >=1.0.0",
    "numba >=0.60.0,<1",
    "numpy >=2.0.0",
]

[project.optional-dependencies]
# cleopatra is pulled by pyramids-gis[viz], which floors it at >=0.31.0. Pin it
# explicitly at the release this package is written against: the typed render
# groups (`plot(color=ColorScaling...)`) are 0.31+, and 0.37 is current.
viz = ["pyramids-gis[viz] >=0.60.0", "cleopatra[tiles] >=0.37.0"]
# dask is listed explicitly even though `pyramids-gis[lazy]` also brings it.
# `_outofcore/distributed.py` does `import dask` in shipped code, reached from the
# public `fill_depressions(engine="tiled", workers>1)`, so this distribution has to
# declare it rather than inherit it from another package's extra — otherwise a
# reshuffle of pyramids' `lazy` extra breaks that call path with nothing here to
# say why. pyramids-gis[lazy] stays for the chunked/cloud I/O the tiled path reads
# through.
distributed = ["dask >=2024.1.0", "pyramids-gis[lazy] >=0.60.0"]
all = ["digital-rivers[viz,distributed]"]

[dependency-groups]
dev = [
    "nbval >=0.11.0",
    "pre-commit >=3.7.1",
    "pre-commit-hooks >=4.6.0",
    "pytest >=8.2.2",
    "pytest-cov >= 5.0.0",
    "pytest-env>=1.6.0",
    "coverage",
    "build>=1.0.0",
    "twine>=5.0.0",
    "pip",
    "jupyterlab",
    "notebook",
    "jupyter",
    "commitizen>=4.8.4",
    "mypy>=1.10.0",
    "types-PyYAML>=6.0.0",
    "pytest-mock>=3.12.0",
    # Same versions the pre-commit hooks pin, so `pixi run -e dev python -m black`
    # and `-m flake8` match what CI and the hooks enforce.
    "black==24.10.0",
    "flake8==7.1.1",
    "Flake8-pyproject>=1.2.3"
]
docs = [
    "mkdocs >=1.5.3",
    "mkdocs-material >=9.5.3",
    "mkdocstrings >=0.24.0",
    "mkdocstrings-python >=1.7.5",
    "mike >=2.1.3",
    "mkdocs-jupyter >=0.25.1",
    "mkdocs-autorefs  >=1.2",
    "mkdocs-macros-plugin  >=1.3.7",
    "mkdocs-table-reader-plugin  >=3.1.0",
    "mkdocs-mermaid2-plugin  >=1.2.1",
    "jupyter-contrib-nbextensions  >=0.7.0",
    "mkdocs-panzoom-plugin",
    "notebook<7.0",
]
notebook = [
    "pip",
    "jupyterlab",
    "notebook",
    "jupyter",
    "ipykernel"
]


[project.urls]
homepage = "https://github.com/serapeum-org/digital-rivers"
repository = "https://github.com/serapeum-org/digital-rivers"
documentation = "https://serapeum-org.github.io/digital-rivers"
Changelog = "https://github.com/serapeum-org/digital-rivers/HISTORY.rst"


[build-system]
requires = ["setuptools>=80.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]

[tool.setuptools.packages.find]
where = ["src"]
include = ["digitalrivers", "digitalrivers.*"]


[tool.flake8]
ignore = ["E203", "E266", "E501", "W503", "E722", "C901", "E741", "E731"]
max-line-length = 88
max-complexity = 18
select = "B,C,E,F,W,T4"

[tool.black]
profile = "flake8"
line-length = 88
skip-string-normalization = true

[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3


[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "pep621"
tag_format = "$version"
changelog_file = "docs/change-log.md"
update_changelog_on_bump = false
major_version_zero = true       # while < 1.0
style = [
    ["qmark", "fg:#ff9d00 bold"],
    ["question", "bold"],
    ["answer", "fg:#ff9d00 bold"],
    ["pointer", "fg:#ff9d00 bold"],
    ["highlighted", "fg:#ff9d00 bold"],
    ["selected", "fg:#cc5454"],
    ["separator", "fg:#cc5454"],
    ["instruction", ""],
    ["text", ""],
    ["disabled", "fg:#858585 italic"]
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "vfs: mark a test as a virtual file system (deselect with '-m \"not vfs\"')",
    "slow: mark test as slow (deselect with '-m \"not slow\"')",
    "fast: mark test as fast (deselect with '-m \"not fast\"')",
    "plot: test plotting function optional package (deselect with '-m \"not plot\"')"
]


[tool.pixi.workspace]
channels = ["conda-forge"]
# The macOS baseline is raised on osx-arm64 so pixi picks the pre-built wheels
# instead of falling back to sdists. pyproj publishes only `macosx_14_0_arm64`
# for arm64, above pixi's default, so without this it has no wheel to take and
# builds from source — which needs PROJ headers the runner does not have. numpy
# and scipy also ship a `macosx_14_0_arm64` build and quietly drop to an older,
# lower-baseline wheel without it. macos-latest runners are >= 14.
#
# Declared here rather than in a `[tool.pixi.system-requirements]` table: pixi
# 0.73 deprecates that table in favour of virtual packages on the platform entry.
#
# No `libc` entry: pyramids-gis used to ship its Linux wheel as `manylinux_2_39`,
# which forced a raised glibc baseline. It ships `manylinux_2_28` now, so the
# override is gone and pixi's own default applies.
platforms = ["win-64", "linux-64", { platform = "osx-arm64", macos = "14.0" }]

[tool.pixi.pypi-dependencies]
digital-rivers = { path = ".", editable = true }
# The editable self-install is the only entry: there are no conda or PyPI
# overrides, and no [tool.pixi.dependencies] table at all. Everything the
# environments get arrives through the standard declarations — runtime deps
# from [project.dependencies], plotting from the `viz` extra, tooling from the
# `dev` / `docs` dependency groups — resolved from PyPI.
#
# Two conda overrides used to live here and are deliberately gone:
#   * gdal — the pyramids-gis wheel vendors its own osgeo, and `import pyramids`
#     prepends that directory to sys.path[0] (activate_vendored_osgeo). Since
#     `digitalrivers/__init__.py` imports pyramids at load, `from osgeo import
#     gdal` always resolves to the vendored copy, so a conda GDAL was installed
#     and never imported. It was only needed back when pyramids-gis was pinned to
#     a git/sdist build, which does not vendor osgeo.
#   * numba — PyPI ships numba and llvmlite wheels for every interpreter in the
#     CI matrix (cp311-cp314), and taking them from PyPI keeps numba, llvmlite
#     and numpy on one ecosystem instead of splitting them.
#
# The conda-forge feedstock build does need a real GDAL, but that belongs in its
# recipe, not in the environments this file defines. That recipe lives outside
# this repo — conda-forge/digital-rivers-feedstock, recipe/meta.yaml — and takes
# its run requirements from [project.dependencies], which is unchanged here.

[tool.pixi.tasks]
main = { cmd = "pytest -vvv --cov=src/digitalrivers -sv -m 'not plot' --cov-report=xml", description = "Run the main test suite" }
plot = { cmd = "pytest -vvv --cov=src/digitalrivers -sv -m 'plot' --cov-report=xml", description = "Run plot test suite" }
notebooks = { cmd = "pytest --nbval --nbval-lax --verbose docs/examples", description = "check notebooks" }
build-dist = { cmd = "python -m build", description = "Build sdist and wheel for PyPI" }
publish-pypi = { cmd = "twine upload --non-interactive --repository pypi dist/*", depends-on = ["build-dist"], description = "Build and upload package to PyPI" }

[tool.pixi.environments]
default = { features = ["py314"], solve-group = "default" }
dev = { features = ["py314", "dev", "viz", "tiled"], solve-group = "default" }
docs = { features = ["py314", "docs"], solve-group = "default" }
py311 = { features = ["py311", "dev", "viz", "tiled"], solve-group = "py311" }
py312 = { features = ["py312", "dev", "viz", "tiled"], solve-group = "py312" }
py313 = { features = ["py313", "dev", "viz", "tiled"], solve-group = "py313" }
py314 = { features = ["py314", "dev", "viz", "tiled"], solve-group = "py314" }


# Interpreter pins, one feature per environment in the matrix. `default`,
# `dev` and `docs` reuse `py314` rather than declaring a second 3.14 pin of
# their own. Nothing else constrains them — without a pin their only bound is
# `requires-python = ">= 3.11, <4"`, so they float to whatever conda-forge
# ships newest. pyramids-gis publishes cp311-cp314 wheels only, so once 3.15
# is out the next re-lock would resolve an interpreter with no wheel and fall
# back to the sdist, which vendors no osgeo — and with no conda GDAL
# underneath, that is a hard import failure. Bump the pin when pyramids ships
# 3.15 wheels. (CI runs `--locked`, so a released 3.15 breaks nothing until
# someone re-locks.)
#
# 3.13 and 3.14 additionally carry a build glob to exclude the free-threaded
# interpreter, whose conda build string ends `_cp313t` / `_cp314t` — the glob
# anchors on the plain suffix, so it matches one and not the other. pyramids
# skips `cp313t` / `cp314t` in cibuildwheel and ships no wheel for either, and
# nothing absorbs that any more: the fallback used to be the conda GDAL, which
# is gone. `pixi lock` and `pixi install` both still succeed in that state, so
# the failure lands at import rather than at resolve time. The solver does not
# choose a free-threaded build here today; pyramids added the same glob only
# after its own solve picked `*_cp314t` on two of its platforms.
#
# 3.11 and 3.12 need no glob — free-threading starts at 3.13, so conda-forge
# publishes no `t` variant to exclude.
# The tiled hydrology path needs dask and nothing else: `_outofcore/distributed.py`
# does `import dask`, reached from `fill_depressions(engine="tiled", workers>1)`, and
# `_outofcore/engine.py` reaches for psutil defensively. Nothing under `_outofcore`
# imports s3fs, zarr, h5py or kerchunk.
#
# Named `tiled`, deliberately NOT `distributed`: pixi auto-activates the
# optional-dependency group of the same name, so a feature called `distributed` would
# pull the published `distributed` extra — and with it `pyramids-gis[lazy]`, which drags
# an AWS/S3 client stack (botocore, s3fs, aiobotocore) and a Zarr/HDF5 stack into every
# environment in the matrix. That is what happened when the old `lazy` group was removed
# in favour of the extra: twenty packages added, none removed. The published extra is
# still the right shape for PyPI users who want the cloud I/O; it just should not be what
# CI installs to run the test suite.
[tool.pixi.feature.tiled.dependencies]
# dask-core, not dask: conda-forge's `dask` is a metapackage that also brings the
# distributed scheduler, bokeh, pyarrow and the AWS/Azure C++ client libraries —
# 102 packages for the one `import dask` in _outofcore/distributed.py. dask-core is
# the library itself, which is all `dask.compute(...)` needs. The `client` argument
# on that path is duck-typed and supplied by the caller; nothing here constructs a
# `Client`, and every test passes scheduler="threads".
dask-core = ">=2024.1.0"

[tool.pixi.feature.py311.dependencies]
python = "3.11.*"
[tool.pixi.feature.py312.dependencies]
python = "3.12.*"
[tool.pixi.feature.py313.dependencies]
python = { version = "3.13.*", build = "*_cp313" }
[tool.pixi.feature.py314.dependencies]
python = { version = "3.14.*", build = "*_cp314" }
