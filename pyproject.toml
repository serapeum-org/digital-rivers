[project]
name = "digital-rivers"
version = "0.2.0"
description = "DEM and raster data processing library"
readme = {file = "README.md", content-type = "text/markdown"}
authors = [
    { name = "Mostafa Farrag", email = "moah.farag@gmail.com" }
]
license = {text = "GNU General Public License v3"}
keywords = ["GIS", "DEM", "Hydrology"]

classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: GIS",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
]

requires-python = ">= 3.11, <4"

# pyramids-gis is pinned to the GitHub `main` branch (not a released PyPI version)
# to pick up unreleased APIs (e.g. `Dataset.create_empty` / `empty_like`, pyramids
# #473). A git/sdist build does NOT vendor osgeo (only pyramids' cibuildwheel
# platform wheel does), so GDAL is supplied from conda-forge via
# [tool.pixi.dependencies] for the pixi environments.
# NOTE: a direct git URL here cannot be uploaded to PyPI — before publishing
# digital-rivers to PyPI, re-pin to a released `pyramids-gis >=x.y` floor (the
# floor must stay >=0.29.0, the first pyramids-gis whose bundled GDAL exposes
# gdal.ViewshedGenerate + the GVM_* viewshed enums used by Terrain.viewshed).
dependencies = [
    "pyramids-gis @ git+https://github.com/serapeum-org/pyramids.git@main",
    "geopandas >=1.0.0",
    "numba >=0.60.0,<1",
    "numpy >=2.0.0",
]

[project.optional-dependencies]
viz = ["pyramids-gis[viz] @ git+https://github.com/serapeum-org/pyramids.git@main"]
# Distributed (out-of-core B7) — dask + distributed for the tiled fill / accumulation dask backend. Reuse
# pyramids' own `lazy` extra (dask + distributed) rather than redeclaring the versions, so for `pip` users dask
# comes from a single source of truth upstream. (The pixi envs get dask from conda `dask-core` via the `lazy`
# feature below — deliberately a different name so pixi does not auto-activate this PyPI extra and drag pyramids'
# whole git closure into the lock.)
distributed = ["pyramids-gis[lazy] @ git+https://github.com/serapeum-org/pyramids.git@main"]
# Convenience meta-extra: `pip install digital-rivers[all]` pulls every optional capability (viz + the dask
# distributed backend). Self-referential so the individual extras above stay the single source of truth. Once the
# package stabilises we can revisit how many extras exist and which can be merged.
all = ["digital-rivers[viz,distributed]"]
dev = [
    "nbval >=0.11.0",
    "pre-commit >=3.7.1",
    "pre-commit-hooks >=4.6.0",
    "pytest >=8.2.2",
    "pytest-cov >= 5.0.0",
    "pytest-env>=1.6.0",
    "coverage",
    "build>=1.0.0",
    "twine>=5.0.0",
    "pip",
    "jupyterlab",
    "notebook",
    "jupyter",
    "commitizen>=4.8.4",
    "mypy>=1.10.0",
    "types-PyYAML>=6.0.0",
    "pytest-mock>=3.12.0"
]
docs = [
    "mkdocs >=1.5.3",
    "mkdocs-material >=9.5.3",
    "mkdocstrings >=0.24.0",
    "mkdocstrings-python >=1.7.5",
    "mike >=2.1.3",
    "mkdocs-jupyter >=0.25.1",
    "mkdocs-autorefs  >=1.2",
    "mkdocs-macros-plugin  >=1.3.7",
    "mkdocs-table-reader-plugin  >=3.1.0",
    "mkdocs-mermaid2-plugin  >=1.2.1",
    "jupyter-contrib-nbextensions  >=0.7.0",
    "mkdocs-panzoom-plugin",
    "notebook<7.0",
]
notebook = [
    "pip",
    "jupyterlab",
    "notebook",
    "jupyter",
    "ipykernel"
]


[project.urls]
homepage = "https://github.com/serapeum-org/digital-rivers"
repository = "https://github.com/serapeum-org/digital-rivers"
documentation = "https://serapeum-org.github.io/digital-rivers"
Changelog = "https://github.com/serapeum-org/digital-rivers/HISTORY.rst"


[build-system]
requires = ["setuptools>=80.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]

[tool.setuptools.packages.find]
where = ["src"]
include = ["digitalrivers", "digitalrivers.*"]


[tool.flake8]
ignore = ["E203", "E266", "E501", "W503", "E722", "C901", "E741", "E731"]
max-line-length = 88
max-complexity = 18
select = "B,C,E,F,W,T4"

[tool.black]
profile = "flake8"
line-length = 88
skip-string-normalization = true

[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3


[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "pep621"
tag_format = "$version"
changelog_file = "docs/change-log.md"
update_changelog_on_bump = false
major_version_zero = true       # while < 1.0
style = [
    ["qmark", "fg:#ff9d00 bold"],
    ["question", "bold"],
    ["answer", "fg:#ff9d00 bold"],
    ["pointer", "fg:#ff9d00 bold"],
    ["highlighted", "fg:#ff9d00 bold"],
    ["selected", "fg:#cc5454"],
    ["separator", "fg:#cc5454"],
    ["instruction", ""],
    ["text", ""],
    ["disabled", "fg:#858585 italic"]
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "vfs: mark a test as a virtual file system (deselect with '-m \"not vfs\"')",
    "slow: mark test as slow (deselect with '-m \"not slow\"')",
    "fast: mark test as fast (deselect with '-m \"not fast\"')",
    "plot: test plotting function optional package (deselect with '-m \"not plot\"')"
]


[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["win-64", "linux-64", "osx-arm64"]

# Raise the resolution baseline so pixi picks the pre-built wheels instead of
# falling back to sdists (which then fail / lack bundled GDAL):
#  * pyramids-gis ships its Linux wheel as `manylinux_2_39` (glibc >= 2.39);
#    pixi defaults to glibc 2.17 at lock time and would otherwise reject it and
#    lock the GDAL-less sdist. See
#    https://serapeum-org.github.io/pyramids/main/installation/
#  * pyproj's osx-arm64 wheel is tagged `macosx_14_0_arm64`, above pixi's
#    default macOS baseline, so raise that too (macos-latest runners are >= 14).
[tool.pixi.system-requirements]
libc = "2.39"
macos = "14.0"

[tool.pixi.pypi-dependencies]
digital-rivers = { path = ".", editable = true }
# pyramids-gis is pinned to git `main` directly in [project.dependencies] (and the
# `viz` extra), so no override is needed here. GDAL for that from-source build is
# supplied from conda-forge — see [tool.pixi.dependencies] below.

[tool.pixi.tasks]
main = { cmd = "pytest -vvv --cov=src/digitalrivers -sv -m 'not plot' --cov-report=xml", description = "Run the main test suite" }
plot = { cmd = "pytest -vvv --cov=src/digitalrivers -sv -m 'plot' --cov-report=xml", description = "Run plot test suite" }
notebooks = { cmd = "pytest --nbval --nbval-lax --verbose docs/examples", description = "check notebooks" }
build-dist = { cmd = "python -m build", description = "Build sdist and wheel for PyPI" }
publish-pypi = { cmd = "twine upload --non-interactive --repository pypi dist/*", depends-on = ["build-dist"], description = "Build and upload package to PyPI" }

[tool.pixi.environments]
default = { features = ["gil"], solve-group = "default" }
dev = { features = ["dev", "viz", "lazy", "gil"], solve-group = "default" }
docs = { features = ["docs", "gil"], solve-group = "default" }
py311 = { features = ["py311", "dev", "viz", "lazy"], solve-group = "py311" }
py312 = { features = ["py312", "dev", "viz", "lazy"], solve-group = "py312" }
py313 = { features = ["py313", "dev", "viz", "lazy"], solve-group = "py313" }
py314 = { features = ["py314", "dev", "viz", "lazy"], solve-group = "py314" }


[tool.pixi.feature.py311.dependencies]
python = "3.11.*"
[tool.pixi.feature.py312.dependencies]
python = "3.12.*"
[tool.pixi.feature.py313.dependencies]
python = "3.13.*"
[tool.pixi.feature.py314.dependencies]
python = "3.14.*"

[tool.pixi.dependencies]
numba = ">=0.60.0,<1"
# pyramids-gis is built from git `main` (sdist) per [project.dependencies], which
# does NOT vendor osgeo; provide GDAL from conda-forge so `from osgeo import gdal`
# works. Pin matches pyramids' own gdal feature (>=3.12,<3.13).
gdal = ">=3.12,<3.13"

# Force the standard (GIL) CPython build for the unpinned `default`
# solve-group (default / dev / docs). Without this, conda-forge's solver
# selects the free-threaded 3.14 variant (build string `*_cp314t`), for
# which pyramids-gis ships NO wheel (its cibuildwheel `skip` excludes
# `cp314t`) — pixi then falls back to the GDAL-less sdist and `import
# digitalrivers` breaks. The `*cp314` build glob matches the regular ABI
# wheel (`pyramids_gis-…-cp314-cp314-…`) and excludes the `cp314t` one.
# Scoped to its own feature (not [tool.pixi.dependencies]) so it doesn't
# collide with the `py311` / `py312` / `py313` env python pins.
[tool.pixi.feature.gil.dependencies]
python = { version = "3.14.*"}

# Dask + distributed for the out-of-core B7 backend, routed through conda-forge (`dask-core`, not the heavy `dask`
# meta-package) to share the same numpy as the rest of the stack — mirrors pyramids' own `lazy` feature. Named
# `lazy` (not `distributed`) so it does not collide with the `distributed` PyPI extra above: a same-named pixi
# feature would make pixi auto-activate that extra on the editable install and pull pyramids' full git closure.
[tool.pixi.feature.lazy.dependencies]
dask-core = ">=2024.1.0"
distributed = ">=2024.1.0"
