[project]
name = "digital-rivers"
version = "0.4.0"
description = "DEM and raster data processing library"
readme = {file = "README.md", content-type = "text/markdown"}
authors = [
    { name = "Mostafa Farrag", email = "moah.farag@gmail.com" }
]
license = {text = "GNU General Public License v3"}
keywords = ["GIS", "DEM", "Hydrology"]

classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: GIS",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
]

requires-python = ">= 3.11, <4"

# pyramids-gis is floored at a released PyPI version. The hard requirement is
# >=0.59.0, the release that renamed `create_from_array` (flat `geo` / `epsg` /
# `top_left_corner` / `cell_size` keywords) to
# `Dataset.from_array(geo_ref=GeoReference(...))` with no compatibility alias —
# every raster this package builds goes through that call. The other APIs it
# uses landed earlier: `plot(color=ColorScaling...)` in 0.51.0, the x-first
# `Window` and the grouped `to_cog(compression=...)` options before that.
# 0.60.0 rather than 0.59.0 is the floor simply because that is the release the
# port was written and verified against, and the one pinned in pixi.lock.
# The floor must also stay >=0.29.0, the first pyramids-gis whose bundled GDAL
# exposes gdal.ViewshedGenerate + the GVM_* viewshed enums used by
# Terrain.viewshed.
dependencies = [
    "pyramids-gis >=0.60.0",
    "geopandas >=1.0.0",
    "numba >=0.60.0,<1",
    "numpy >=2.0.0",
]

[project.optional-dependencies]
# cleopatra is pulled by pyramids-gis[viz], which floors it at >=0.31.0. Pin it
# explicitly at the release this package is written against: the typed render
# groups (`plot(color=ColorScaling...)`) are 0.31+, and 0.37 is current.
viz = ["pyramids-gis[viz] >=0.60.0", "cleopatra[tiles] >=0.37.0"]
distributed = ["pyramids-gis[lazy] >=0.60.0"]
all = ["digital-rivers[viz,distributed]"]

[dependency-groups]
dev = [
    "nbval >=0.11.0",
    "pre-commit >=3.7.1",
    "pre-commit-hooks >=4.6.0",
    "pytest >=8.2.2",
    "pytest-cov >= 5.0.0",
    "pytest-env>=1.6.0",
    "coverage",
    "build>=1.0.0",
    "twine>=5.0.0",
    "pip",
    "jupyterlab",
    "notebook",
    "jupyter",
    "commitizen>=4.8.4",
    "mypy>=1.10.0",
    "types-PyYAML>=6.0.0",
    "pytest-mock>=3.12.0",
    # Same versions the pre-commit hooks pin, so `pixi run -e dev python -m black`
    # and `-m flake8` match what CI and the hooks enforce.
    "black==24.10.0",
    "flake8==7.1.1",
    "Flake8-pyproject>=1.2.3"
]
docs = [
    "mkdocs >=1.5.3",
    "mkdocs-material >=9.5.3",
    "mkdocstrings >=0.24.0",
    "mkdocstrings-python >=1.7.5",
    "mike >=2.1.3",
    "mkdocs-jupyter >=0.25.1",
    "mkdocs-autorefs  >=1.2",
    "mkdocs-macros-plugin  >=1.3.7",
    "mkdocs-table-reader-plugin  >=3.1.0",
    "mkdocs-mermaid2-plugin  >=1.2.1",
    "jupyter-contrib-nbextensions  >=0.7.0",
    "mkdocs-panzoom-plugin",
    "notebook<7.0",
]
notebook = [
    "pip",
    "jupyterlab",
    "notebook",
    "jupyter",
    "ipykernel"
]


[project.urls]
homepage = "https://github.com/serapeum-org/digital-rivers"
repository = "https://github.com/serapeum-org/digital-rivers"
documentation = "https://serapeum-org.github.io/digital-rivers"
Changelog = "https://github.com/serapeum-org/digital-rivers/HISTORY.rst"


[build-system]
requires = ["setuptools>=80.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]

[tool.setuptools.packages.find]
where = ["src"]
include = ["digitalrivers", "digitalrivers.*"]


[tool.flake8]
ignore = ["E203", "E266", "E501", "W503", "E722", "C901", "E741", "E731"]
max-line-length = 88
max-complexity = 18
select = "B,C,E,F,W,T4"

[tool.black]
profile = "flake8"
line-length = 88
skip-string-normalization = true

[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3


[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "pep621"
tag_format = "$version"
changelog_file = "docs/change-log.md"
update_changelog_on_bump = false
major_version_zero = true       # while < 1.0
style = [
    ["qmark", "fg:#ff9d00 bold"],
    ["question", "bold"],
    ["answer", "fg:#ff9d00 bold"],
    ["pointer", "fg:#ff9d00 bold"],
    ["highlighted", "fg:#ff9d00 bold"],
    ["selected", "fg:#cc5454"],
    ["separator", "fg:#cc5454"],
    ["instruction", ""],
    ["text", ""],
    ["disabled", "fg:#858585 italic"]
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "vfs: mark a test as a virtual file system (deselect with '-m \"not vfs\"')",
    "slow: mark test as slow (deselect with '-m \"not slow\"')",
    "fast: mark test as fast (deselect with '-m \"not fast\"')",
    "plot: test plotting function optional package (deselect with '-m \"not plot\"')"
]


[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["win-64", "linux-64", "osx-arm64"]

# Raise the macOS baseline so pixi picks the pre-built wheel instead of falling
# back to an sdist: pyproj's osx-arm64 wheel is tagged `macosx_14_0_arm64`,
# above pixi's default (macos-latest runners are >= 14).
# No `libc` entry: pyramids-gis used to ship its Linux wheel as
# `manylinux_2_39`, which forced a raised glibc baseline. It ships
# `manylinux_2_28` now, so the override is gone and pixi's own default applies.
[tool.pixi.system-requirements]
macos = "14.0"

[tool.pixi.pypi-dependencies]
digital-rivers = { path = ".", editable = true }
# pyramids-gis is floored in [project.dependencies] (and the `viz` / `distributed`
# extras), so no override is needed here. GDAL is supplied from conda-forge — see
# [tool.pixi.dependencies] below.

[tool.pixi.tasks]
main = { cmd = "pytest -vvv --cov=src/digitalrivers -sv -m 'not plot' --cov-report=xml", description = "Run the main test suite" }
plot = { cmd = "pytest -vvv --cov=src/digitalrivers -sv -m 'plot' --cov-report=xml", description = "Run plot test suite" }
notebooks = { cmd = "pytest --nbval --nbval-lax --verbose docs/examples", description = "check notebooks" }
build-dist = { cmd = "python -m build", description = "Build sdist and wheel for PyPI" }
publish-pypi = { cmd = "twine upload --non-interactive --repository pypi dist/*", depends-on = ["build-dist"], description = "Build and upload package to PyPI" }

[tool.pixi.environments]
default = { features = ["gil"], solve-group = "default" }
dev = { features = ["dev", "viz", "lazy", "gil"], solve-group = "default" }
docs = { features = ["docs", "gil"], solve-group = "default" }
py311 = { features = ["py311", "dev", "viz", "lazy"], solve-group = "py311" }
py312 = { features = ["py312", "dev", "viz", "lazy"], solve-group = "py312" }
py313 = { features = ["py313", "dev", "viz", "lazy"], solve-group = "py313" }
py314 = { features = ["py314", "dev", "viz", "lazy"], solve-group = "py314" }


[tool.pixi.feature.py311.dependencies]
python = "3.11.*"
[tool.pixi.feature.py312.dependencies]
python = "3.12.*"
[tool.pixi.feature.py313.dependencies]
python = "3.13.*"
[tool.pixi.feature.py314.dependencies]
python = "3.14.*"

[tool.pixi.dependencies]
numba = ">=0.60.0,<1"
# NOTE: this conda GDAL is currently SHADOWED, not used. The pyramids-gis
# wheel vendors its own osgeo, and `import pyramids` prepends that directory
# to sys.path[0] (activate_vendored_osgeo); `digitalrivers/__init__.py`
# imports pyramids at load, so by the time anything says `from osgeo import
# gdal` the vendored copy wins. Verified: osgeo resolves under
# site-packages/pyramids/_vendor/. Both stacks are the same 3.13.3 here, so
# the pin costs disk rather than correctness — but it is dead weight, and the
# version match is what stops it becoming a real skew. Kept pinned to
# pyramids' own gdal feature until we decide whether to drop it (the
# conda-forge feedstock build does want a real GDAL; the wheel does not).
gdal = ">=3.13.3,<3.13.4"

# Force the standard (GIL) CPython build for the unpinned `default`
# solve-group (default / dev / docs). Without this, conda-forge's solver
# selects the free-threaded 3.14 variant (build string `*_cp314t`), for
# which pyramids-gis ships NO wheel (its cibuildwheel `skip` excludes
# `cp314t`) — pixi then falls back to the GDAL-less sdist and `import
# digitalrivers` breaks. The `*cp314` build glob matches the regular ABI
# wheel (`pyramids_gis-…-cp314-cp314-…`) and excludes the `cp314t` one.
# Scoped to its own feature (not [tool.pixi.dependencies]) so it doesn't
# collide with the `py311` / `py312` / `py313` env python pins.
[tool.pixi.feature.gil.dependencies]
python = { version = "3.14.*"}

# Dask backend for the out-of-core B7 path, via conda-forge `dask-core`. Named `lazy` (not `distributed`) so it
# does not collide with the `distributed` PyPI extra and trigger pixi to auto-activate it.
[tool.pixi.feature.lazy.dependencies]
dask-core = ">=2024.1.0"
distributed = ">=2024.1.0"
